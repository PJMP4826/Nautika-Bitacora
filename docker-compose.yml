services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: nautika-bitacora:latest
    container_name: nautika-app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:80"
    environment:
      APP_NAME: ${APP_NAME:-Nautika-Bitacora}
      APP_ENV: ${APP_ENV:-production}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_URL: ${APP_URL:-http://localhost:8000}

      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-nautika_bitacora}
      DB_USERNAME: ${DB_USERNAME:-nautika}
      DB_PASSWORD: ${DB_PASSWORD:-secret}

      SESSION_DRIVER: database
      CACHE_STORE: database
      QUEUE_CONNECTION: database
      FILESYSTEM_DISK: local
      LOG_CHANNEL: stack
      LOG_LEVEL: ${LOG_LEVEL:-warning}
    volumes:
      - app_storage:/var/www/html/storage/app
    depends_on:
      db:
        condition: service_healthy
    networks:
      - nautika

  db:
    image: postgres:18-alpine
    container_name: nautika-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-nautika_bitacora}
      POSTGRES_USER: ${DB_USERNAME:-nautika}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - db_data:/var/lib/postgresql
    ports:
      - "${DB_PORT_EXPOSED:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-nautika} -d ${DB_DATABASE:-nautika_bitacora}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - nautika

volumes:
  db_data:
  app_storage:

networks:
  nautika:
    driver: bridge